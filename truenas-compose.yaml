# FBI-BOT for TrueNAS SCALE: paste into Apps > Discover Apps > (⋮) Install via YAML.
#
# Before installing:
#   1. In the TrueNAS shell, create the dataset paths and config:
#        mkdir -p /mnt/tank/apps/fbi-mumble-bot/recordings
#        # put your bot.conf here (copy bot.conf.example from the repo,
#        # set server/channels, keep output_dir = /app/recordings)
#   2. Give the app user ownership of recordings:
#        chown -R 568:568 /mnt/tank/apps/fbi-mumble-bot/recordings
#   3. Adjust the two host paths below if your pool/dataset differs.
#   4. Private image pull: this image lives in GHCR under a private repo, so
#      TrueNAS must authenticate once. In the TrueNAS shell run:
#        docker login ghcr.io -u DefconUnicorn
#      (paste a Personal Access Token with read:packages when asked).
#      Alternative: make the GHCR package public, then no login is needed.
#
# No build: needed — TrueNAS YAML import cannot build: from a Dockerfile.

services:
  fbi-bot:
    image: ghcr.io/defconunicorn/fbi-mumble-bot:1.0.4
    container_name: fbi-bot
    restart: unless-stopped
    user: "568:568"
    environment:
      - TZ=Europe/London
    volumes:
      - /mnt/tank/apps/fbi-mumble-bot/bot.conf:/app/bot.conf:ro
      - /mnt/tank/apps/fbi-mumble-bot/recordings:/app/recordings
